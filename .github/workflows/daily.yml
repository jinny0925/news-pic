name: Daily News Generation

on:
  schedule:
    # 한국시간 7:00, 7:30, 8:00, 9:00 (백업용 - cron-job.org가 메인)
    - cron: '0 21 * * *'    # 한국 6:00
    - cron: '30 21 * * *'   # 한국 6:30
    - cron: '0 22 * * *'    # 한국 7:00
    - cron: '0 23 * * *'    # 한국 8:00
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    # 이미지 다운로드에 시간이 걸리므로 최대 30분
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 오늘 이미 생성됐는지 확인
        id: check
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          if [ -f "data/$TODAY.json" ]; then
            echo "already_done=true" >> $GITHUB_OUTPUT
            echo "✅ 오늘 이미 생성됨, 건너뜀"
          else
            echo "already_done=false" >> $GITHUB_OUTPUT
            echo "🌅 오늘 처음 실행"
          fi

      - name: 파이썬 설치
        if: steps.check.outputs.already_done == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        if: steps.check.outputs.already_done == 'false'
        run: pip install -r requirements.txt

      - name: 뉴스 생성 스크립트 실행
        if: steps.check.outputs.already_done == 'false'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py

      - name: 결과를 저장소에 커밋
        if: steps.check.outputs.already_done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "🗞️ 일일 뉴스 업데이트: $(TZ='Asia/Seoul' date +'%Y-%m-%d')"
          git push
