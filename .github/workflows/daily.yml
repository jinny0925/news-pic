name: Daily News Generation

on:
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 2026-05-11 뉴스 복구
        env:
          TARGET_DATE: 2026-05-11
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py

      - name: 2026-05-12 뉴스 복구
        env:
          TARGET_DATE: 2026-05-12
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py

      - name: 오늘 뉴스 다시 생성해서 latest 업데이트
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py

      - name: 결과를 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --staged --quiet || git commit -m "🗞️ 누락 뉴스 복구 및 오늘 뉴스 업데이트"

          git push origin main

      - name: 카카오톡 알림 발송
        if: success()
        env:
          KAKAO_CLIENT_ID_WIFE: ${{ secrets.KAKAO_CLIENT_ID_WIFE }}
          KAKAO_CLIENT_SECRET_WIFE: ${{ secrets.KAKAO_CLIENT_SECRET_WIFE }}
          KAKAO_REFRESH_TOKEN_WIFE: ${{ secrets.KAKAO_REFRESH_TOKEN_WIFE }}
          KAKAO_FRIEND_UUID_HUSBAND: ${{ secrets.KAKAO_FRIEND_UUID_HUSBAND }}

          KAKAO_CLIENT_ID_HUSBAND: ${{ secrets.KAKAO_CLIENT_ID_HUSBAND }}
          KAKAO_CLIENT_SECRET_HUSBAND: ${{ secrets.KAKAO_CLIENT_SECRET_HUSBAND }}
          KAKAO_REFRESH_TOKEN_HUSBAND: ${{ secrets.KAKAO_REFRESH_TOKEN_HUSBAND }}
          KAKAO_FRIEND_UUID_WIFE: ${{ secrets.KAKAO_FRIEND_UUID_WIFE }}
        run: python scripts/send_kakao.py
