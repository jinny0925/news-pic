<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>News.pic — 오늘의 뉴스, 한 장으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,700&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fef6ec;
    --bg-soft: #fbeedb;
    --paper: #ffffff;
    --ink: #2a2420;
    --ink-soft: #6b6058;
    --accent: #ff6b4a;
    --accent-soft: #ffd4c7;
    --yellow: #ffc94d;
    --yellow-soft: #fff0cc;
    --blue: #5b9fd6;
    --blue-soft: #d6ebf7;
    --green: #7cc096;
    --green-soft: #d8efe1;
    --pink: #ff9bb5;
    --pink-soft: #ffe0e8;
    --purple: #a89cd9;
    --purple-soft: #e6e0f5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }

  body {
    font-family: 'IBM Plex Sans KR', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 12% 18%, var(--pink-soft) 0%, transparent 18%),
      radial-gradient(circle at 88% 62%, var(--blue-soft) 0%, transparent 22%),
      radial-gradient(circle at 50% 92%, var(--yellow-soft) 0%, transparent 18%);
    background-attachment: fixed;
  }

  .display { font-family: 'Fraunces', serif; }
  .hand { font-family: 'Gaegu', cursive; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 80px;
  }

  /* HEADER */
  header {
    padding: 20px 20px 14px;
    position: sticky;
    top: 0;
    background: rgba(254, 246, 236, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    border-bottom: 1.5px solid var(--ink);
  }

  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .logo-wrap { display: flex; align-items: center; gap: 8px; }

  .logo-icon {
    width: 38px; height: 38px;
    background: var(--accent);
    border: 2px solid var(--ink);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transform: rotate(-6deg);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.03em;
    font-style: italic;
  }
  .logo-dot { color: var(--accent); }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    padding: 4px;
    box-shadow: 2px 2px 0 var(--ink);
  }

  .date-btn {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .date-btn:active { background: var(--bg-soft); }
  .date-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .date-display {
    font-size: 13px;
    font-weight: 600;
    padding: 0 4px;
    min-width: 80px;
    text-align: center;
  }

  .header-meta {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .header-meta .hand { font-size: 16px; color: var(--accent); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    cursor: pointer;
    transition: transform 0.15s;
    white-space: nowrap;
  }
  .tab:active { transform: scale(0.95); }
  .tab.active { background: var(--ink); color: var(--bg); }

  /* HEADLINE */
  .section-headline {
    padding: 16px 20px 8px;
  }

  .section-headline-label {
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-headline-label::before {
    content: "✨";
  }

  .headline-card {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 24px;
    padding: 0;
    box-shadow: 5px 5px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    overflow: hidden;
    position: relative;
  }

  .headline-card:active {
    transform: translate(2px, 2px);
    box-shadow: 3px 3px 0 var(--ink);
  }

  .headline-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: var(--bg-soft);
    display: block;
    border-bottom: 2px solid var(--ink);
  }

  .headline-img-loading {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 13px;
    border-bottom: 2px solid var(--ink);
  }

  .headline-body {
    padding: 18px 20px 20px;
  }

  .headline-card .card-tag { margin-bottom: 10px; }

  .headline-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .headline-subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .headline-stats {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .headline-stat {
    background: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12px;
    flex: 1;
    min-width: 80px;
    text-align: center;
  }

  .headline-stat strong {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    display: block;
    line-height: 1;
  }

  .headline-stat span {
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 4px;
    display: block;
  }

  /* CATEGORY SECTION */
  .section-category {
    padding: 16px 0 8px;
  }

  .section-header {
    padding: 0 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .section-more {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    font-family: inherit;
  }

  /* HORIZONTAL SCROLL */
  .h-scroll {
    display: flex;
    gap: 14px;
    padding: 4px 20px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }
  .h-scroll::-webkit-scrollbar { display: none; }

  .mini-card {
    flex-shrink: 0;
    width: 240px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 18px;
    padding: 0;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    overflow: hidden;
    scroll-snap-align: start;
  }

  .mini-card:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  .mini-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: var(--bg-soft);
    display: block;
    border-bottom: 1.5px solid var(--ink);
  }

  .mini-img-loading {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border-bottom: 1.5px solid var(--ink);
  }

  .mini-body {
    padding: 12px 14px 14px;
  }

  .mini-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    border: 1.5px solid var(--ink);
    margin-bottom: 8px;
  }

  .mini-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 4px;
    /* 2줄까지만 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .mini-subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* TAG COLORS */
  .tag-world { background: var(--accent-soft); }
  .tag-economy { background: var(--yellow-soft); }
  .tag-tech { background: var(--blue-soft); }
  .tag-society { background: var(--green-soft); }
  .tag-life { background: var(--pink-soft); }

  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--ink);
  }

  /* FILTERED MODE (한 카테고리만 보기) */
  .filtered-grid {
    padding: 0 20px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .filtered-grid .mini-card {
    width: auto;
  }

  /* STATE */
  .state-msg {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
  }
  .state-msg .icon { font-size: 48px; margin-bottom: 16px; }
  .state-msg .title { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); margin-bottom: 8px; }
  .state-msg .desc { font-size: 14px; line-height: 1.6; }

  /* FOOTER */
  footer {
    margin-top: 32px;
    padding: 24px 20px 40px;
    text-align: center;
  }

  .quote {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .footer-line {
    margin-top: 10px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 36, 32, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    background: var(--paper);
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border: 1.5px solid var(--ink);
    border-bottom: none;
    z-index: 201;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal.open { transform: translateX(-50%) translateY(0); }

  .modal-handle {
    width: 40px; height: 5px;
    background: var(--ink-soft);
    border-radius: 5px;
    margin: 12px auto 8px;
    opacity: 0.4;
  }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 2px 2px 0 var(--ink);
    z-index: 2;
  }

  .modal-body { padding: 24px 22px 32px; }

  .modal-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    margin-bottom: 14px;
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .modal-subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
    margin-bottom: 20px;
  }

  .modal-image {
    width: 100%;
    border: 1.5px solid var(--ink);
    border-radius: 16px;
    margin-bottom: 20px;
    aspect-ratio: 8/5;
    object-fit: cover;
    display: block;
  }

  .modal-image-loading {
    width: 100%;
    aspect-ratio: 8/5;
    border: 1.5px solid var(--ink);
    border-radius: 16px;
    margin-bottom: 20px;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .modal-section { margin-bottom: 20px; }

  .modal-section-label {
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .modal-section p { font-size: 14px; line-height: 1.7; }
  .modal-section ul { padding-left: 20px; font-size: 14px; line-height: 1.8; }
  .modal-section ul li { margin-bottom: 4px; }

  .modal-quote {
    background: var(--yellow-soft);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 12px 14px;
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-size: 14px;
    line-height: 1.6;
  }

  .modal-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .modal-stat {
    background: var(--bg-soft);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
  }

  .modal-stat strong {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    display: block;
    color: var(--accent);
    line-height: 1;
  }

  .modal-stat span {
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 4px;
    display: block;
  }

  .source-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    text-decoration: none;
    color: var(--ink);
    font-size: 13px;
  }

  .source-link-arrow { font-size: 16px; color: var(--accent); }

  /* BACK BUTTON */
  .back-btn {
    margin: 12px 20px 0;
    padding: 8px 14px;
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    background: var(--paper);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .back-btn:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  /* Animations */
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .headline-card, .section-category, .filtered-grid > * {
    animation: pop 0.4s ease-out backwards;
  }

  /* 데스크톱 */
  @media (min-width: 600px) {
    body { padding: 20px 0; }
    .app {
      border: 1.5px solid var(--ink);
      border-radius: 28px;
      box-shadow: 8px 8px 0 var(--ink);
      background: var(--bg);
      overflow: hidden;
      padding-bottom: 0;
    }
    header { border-radius: 28px 28px 0 0; }
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="header-row">
      <div class="logo-wrap">
        <div class="logo-icon">📰</div>
        <div class="logo">News<span class="logo-dot">.</span>pic</div>
      </div>
      <div class="date-nav">
        <button class="date-btn" id="prevDate">‹</button>
        <span class="date-display" id="dateDisplay">로딩중</span>
        <button class="date-btn" id="nextDate">›</button>
      </div>
    </div>
    <div class="header-meta">
      <span class="hand" id="greeting">오늘도 좋은 아침! ☀️</span>
      <span id="readTime">잠시만요</span>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">✨ 전체</div>
    <div class="tab" data-cat="world">🌍 국제</div>
    <div class="tab" data-cat="economy">💰 경제</div>
    <div class="tab" data-cat="tech">💻 기술</div>
    <div class="tab" data-cat="society">🏛 사회</div>
    <div class="tab" data-cat="life">🌱 라이프</div>
  </div>

  <div id="content">
    <div class="state-msg">
      <div class="icon">⏳</div>
      <div class="title">뉴스 불러오는 중...</div>
      <div class="desc">잠시만 기다려주세요</div>
    </div>
  </div>

  <footer>
    <div class="quote">"복잡한 세상을, 한 장의 그림으로."</div>
    <div class="footer-line">매일 아침 7시, 큐레이션된 뉴스 인포그래픽</div>
  </footer>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="overlay"></div>
<div class="modal" id="modal">
  <div class="modal-handle"></div>
  <button class="modal-close" id="closeBtn">✕</button>
  <div class="modal-body" id="modalBody"></div>
</div>

<script>
  // ===== STATE =====
  let currentDate = new Date();
  let currentData = null;
  let currentCategory = 'all';

  const CATEGORY_INFO = {
    world:    { label: '🌍 국제',   tagClass: 'tag-world' },
    economy:  { label: '💰 경제',   tagClass: 'tag-economy' },
    tech:     { label: '💻 기술',   tagClass: 'tag-tech' },
    society:  { label: '🏛 사회',   tagClass: 'tag-society' },
    life:     { label: '🌱 라이프', tagClass: 'tag-life' }
  };

  const CATEGORY_ORDER = ['world', 'economy', 'tech', 'society', 'life'];

  // ===== UTILS =====
  function formatDate(d) { return d.toISOString().split('T')[0]; }

  function formatDisplayDate(d) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const target = new Date(d);
    target.setHours(0,0,0,0);

    if (target.getTime() === today.getTime()) return '오늘';
    if (target.getTime() === yesterday.getTime()) return '어제';

    const m = d.getMonth() + 1;
    const day = d.getDate();
    const dayNames = ['일','월','화','수','목','금','토'];
    return `${m}/${day} ${dayNames[d.getDay()]}`;
  }

  // ===== LOAD =====
  async function loadData(date) {
    const dateStr = formatDate(date);
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="state-msg">
        <div class="icon">⏳</div>
        <div class="title">뉴스 불러오는 중...</div>
        <div class="desc">${dateStr}</div>
      </div>
    `;

    try {
      const today = formatDate(new Date());
      const path = (dateStr === today) ? 'data/latest.json' : `data/${dateStr}.json`;
      const res = await fetch(path);
      if (!res.ok) throw new Error('not found');
      currentData = await res.json();
      render();
    } catch (err) {
      content.innerHTML = `
        <div class="state-msg">
          <div class="icon">📭</div>
          <div class="title">이 날의 뉴스가 없어요</div>
          <div class="desc">${dateStr}<br>다른 날짜를 골라보세요</div>
        </div>
      `;
      currentData = null;
      updateMeta();
    }
  }

  // ===== RENDER =====
  function render() {
    if (!currentData || !currentData.cards) return;

    if (currentCategory === 'all') {
      renderHomeView();
    } else {
      renderCategoryView(currentCategory);
    }
    updateMeta();
  }

  function renderHomeView() {
    const cards = currentData.cards;
    const headline = cards.find(c => c.is_headline) || cards[0];
    const otherCards = cards.filter(c => c !== headline);

    let html = '';

    // 헤드라인
    if (headline) {
      html += `
        <div class="section-headline">
          <div class="section-headline-label">오늘의 헤드라인</div>
          ${renderHeadlineCard(headline)}
        </div>
      `;
    }

    // 카테고리별 가로 스크롤
    CATEGORY_ORDER.forEach(cat => {
      const catCards = otherCards.filter(c => c.category === cat);
      if (catCards.length === 0) return;

      const info = CATEGORY_INFO[cat];
      html += `
        <div class="section-category">
          <div class="section-header">
            <h2 class="section-title">${info.label}</h2>
            <button class="section-more" data-cat="${cat}">더보기 →</button>
          </div>
          <div class="h-scroll">
            ${catCards.map(c => renderMiniCard(c)).join('')}
          </div>
        </div>
      `;
    });

    document.getElementById('content').innerHTML = html;
    bindCardEvents();
  }

  function renderCategoryView(cat) {
    const cards = currentData.cards.filter(c => c.category === cat);
    const info = CATEGORY_INFO[cat];

    if (cards.length === 0) {
      document.getElementById('content').innerHTML = `
        <div class="state-msg">
          <div class="icon">🔍</div>
          <div class="title">${info.label} 카테고리에 뉴스가 없어요</div>
          <div class="desc">다른 카테고리를 골라보세요</div>
        </div>
      `;
      return;
    }

    document.getElementById('content').innerHTML = `
      <div class="filtered-grid">
        ${cards.map(c => renderMiniCard(c)).join('')}
      </div>
    `;
    bindCardEvents();
  }

  function renderHeadlineCard(c) {
    const info = CATEGORY_INFO[c.category] || CATEGORY_INFO.world;
    const stats = (c.viz_data && c.viz_data.stats) ? c.viz_data.stats.slice(0, 3) : [];

    return `
      <article class="headline-card" data-id="${c.id}">
        <div class="headline-img-loading" id="loading-${c.id}">
          <span style="font-size: 24px;">🎨</span>
        </div>
        <img class="headline-img" src="${c.image_url || ''}" alt=""
             style="display:none;"
             onload="this.style.display='block'; const l=document.getElementById('loading-${c.id}'); if(l) l.style.display='none';"
             onerror="const l=document.getElementById('loading-${c.id}'); if(l) l.innerHTML='<span style=&quot;font-size:24px;&quot;>🖼️</span>';" />
        <div class="headline-body">
          <span class="card-tag ${info.tagClass}">${c.category_label || info.label}</span>
          <h2 class="headline-title">${c.title || ''}</h2>
          <p class="headline-subtitle">${c.subtitle || ''}</p>
          ${stats.length > 0 ? `
            <div class="headline-stats">
              ${stats.map(s => `
                <div class="headline-stat">
                  <strong>${s.value || ''}</strong>
                  <span>${s.label || ''}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      </article>
    `;
  }

  function renderMiniCard(c) {
    const info = CATEGORY_INFO[c.category] || CATEGORY_INFO.world;
    return `
      <article class="mini-card" data-id="${c.id}">
        <div class="mini-img-loading" id="mloading-${c.id}">🎨</div>
        <img class="mini-img" src="${c.image_url || ''}" alt=""
             style="display:none;"
             onload="this.style.display='block'; const l=document.getElementById('mloading-${c.id}'); if(l) l.style.display='none';"
             onerror="const l=document.getElementById('mloading-${c.id}'); if(l) l.innerHTML='🖼️';" />
        <div class="mini-body">
          <span class="mini-tag ${info.tagClass}">${c.category_label || info.label}</span>
          <h3 class="mini-title">${c.title || ''}</h3>
          <p class="mini-subtitle">${c.subtitle || ''}</p>
        </div>
      </article>
    `;
  }

  function bindCardEvents() {
    document.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => openModal(el.dataset.id));
    });
    document.querySelectorAll('.section-more').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cat = btn.dataset.cat;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-cat="${cat}"]`).classList.add('active');
        currentCategory = cat;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function updateMeta() {
    document.getElementById('dateDisplay').textContent = formatDisplayDate(currentDate);
    if (currentData && currentData.cards) {
      const count = currentCategory === 'all'
        ? currentData.cards.length
        : currentData.cards.filter(c => c.category === currentCategory).length;
      document.getElementById('readTime').textContent = `${count}개의 이야기`;
    } else {
      document.getElementById('readTime').textContent = '';
    }
    const today = new Date();
    today.setHours(23,59,59,999);
    document.getElementById('nextDate').disabled = currentDate >= today;
  }

  // ===== MODAL =====
  function openModal(cardId) {
    const card = currentData.cards.find(c => c.id === cardId);
    if (!card) return;
    const detail = card.detail || {};
    const info = CATEGORY_INFO[card.category] || CATEGORY_INFO.world;
    const stats = (card.viz_data && card.viz_data.stats) ? card.viz_data.stats : [];

    document.getElementById('modalBody').innerHTML = `
      <span class="modal-tag ${info.tagClass}">${card.category_label || info.label}</span>
      <h2 class="modal-title">${card.title}</h2>
      <p class="modal-subtitle">${card.subtitle}</p>

      <div class="modal-image-loading" id="modalLoading">
        <div style="font-size: 32px;">🎨</div>
        <div>그림 그리는 중...</div>
      </div>
      <img class="modal-image" id="modalImg" src="${card.image_url || ''}" alt=""
           style="display:none;"
           onload="document.getElementById('modalLoading').style.display='none'; this.style.display='block';"
           onerror="document.getElementById('modalLoading').innerHTML='<div style=&quot;font-size:32px;&quot;>🖼️</div><div>이미지를 불러올 수 없어요</div>';" />

      ${stats.length > 0 ? `
        <div class="modal-stats">
          ${stats.slice(0,3).map(s => `
            <div class="modal-stat">
              <strong>${s.value || ''}</strong>
              <span>${s.label || ''}</span>
            </div>
          `).join('')}
        </div>` : ''}

      ${detail.summary ? `
        <div class="modal-section">
          <div class="modal-section-label">📌 한 줄 요약</div>
          <p>${detail.summary}</p>
        </div>` : ''}

      ${detail.points && detail.points.length ? `
        <div class="modal-section">
          <div class="modal-section-label">🔍 핵심 포인트</div>
          <ul>${detail.points.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>` : ''}

      ${detail.quote ? `
        <div class="modal-section">
          <div class="modal-section-label">💬 인용</div>
          <div class="modal-quote">${detail.quote}</div>
        </div>` : ''}

      ${detail.context ? `
        <div class="modal-section">
          <div class="modal-section-label">🌱 배경</div>
          <p>${detail.context}</p>
        </div>` : ''}

      ${detail.source_url && detail.source_url !== '#' ? `
        <div class="modal-section">
          <div class="modal-section-label">🔗 원문 보기</div>
          <a href="${detail.source_url}" target="_blank" class="source-link">
            <strong>원문으로 이동</strong>
            <span class="source-link-arrow">→</span>
          </a>
        </div>` : ''}
    `;

    document.getElementById('overlay').classList.add('open');
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ===== EVENTS =====
  document.getElementById('overlay').addEventListener('click', closeModal);
  document.getElementById('closeBtn').addEventListener('click', closeModal);

  document.getElementById('prevDate').addEventListener('click', () => {
    currentDate.setDate(currentDate.getDate() - 1);
    loadData(currentDate);
  });

  document.getElementById('nextDate').addEventListener('click', () => {
    const today = new Date();
    if (currentDate >= today) return;
    currentDate.setDate(currentDate.getDate() + 1);
    loadData(currentDate);
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.cat;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  // ===== START =====
  loadData(currentDate);
</script>

</body>
</html>
